
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print("Manifest XML is valid")
          except Exception as e:
              print("MANIFEST ERROR:")
              print(e)
              raise
          PY

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Makdad-Anatomy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
