name: Build Offline Anatomy Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout anatomy atlas
        uses: actions/checkout@v4
        with:
          repository: CognitionLabSNUC/open-anatomy-atlas
          path: open-anatomy-atlas

      - name: Download complete anatomy data
        working-directory: open-anatomy-atlas
        run: |
          node tools/fetch-data.js \
            --source bp3d43 \
            --dir "$RUNNER_TEMP/atlas-data"

      - name: Build offline atlas
        working-directory: open-anatomy-atlas
        run: |
          node tools/build-site.js \
            --dir "$RUNNER_TEMP/atlas-data" \
            --out "$RUNNER_TEMP/site" \
            --atlases bp3d43 \
            --default bp3d43

      - name: Verify complete atlas
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dir = path.join(process.env.RUNNER_TEMP, 'site/data/bp3d43');
          const file = path.join(dir, 'index.json');

          if (!fs.existsSync(file)) {
            throw new Error('Atlas index is missing');
          }

          const index = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!index.counts || !index.counts.elements || !index.counts.concepts) {
            throw new Error('Atlas structure data is incomplete');
          }

          if (!Array.isArray(index.parts) || index.parts.length === 0) {
            throw new Error('Atlas mesh parts are missing');
          }

          for (const part of index.parts) {
            const partPath = path.join(dir, part.file);
            if (!fs.existsSync(partPath)) {
              throw new Error(`Missing mesh part: ${part.file}`);
            }
          }

          console.log('Complete atlas verified');
          console.log('Elements:', index.counts.elements);
          console.log('Structures:', index.counts.concepts);
          console.log('Mesh parts:', index.parts.length);
          NODE

      - name: Compress complete atlas
        run: |
          cd "$RUNNER_TEMP/site/data"
          zip -qr "$RUNNER_TEMP/atlas-bp3d43.zip" bp3d43

      - name: Publish complete anatomy package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atlas-data-bp3d43-v1
          name: Offline Anatomy Data
          body: |
            Complete BodyParts3D 4.3 anatomical atlas.
            Includes all structures provided by the source atlas.
            Licensed under CC BY 4.0.
          files: ${{ runner.temp }}/atlas-bp3d43.zip
          overwrite_files: true
          make_latest: false
